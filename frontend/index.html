<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-PARK” Lot assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F5F2;--panel:#FFF;--line:#DEDBD3;--ink:#171A1F;--muted:#6B6F76;--accent:#2A57C7;--accent-ink:#FFF;--free:#1F7A4D;--taken:#B23A2E;--held:#9C6B00;--free-bg:#EAF4EE;--taken-bg:#FBEBE9;--held-bg:#FBF1DF}*,*::before,*::after{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}.brand{display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}.brand h1{font-size:15px;margin:0;font-weight:600}.brand p{margin:0;font-size:12px;color:var(--muted)}.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--free)}.dot.off{background:var(--taken)}.body{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}.chatcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.thread{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;max-width:640px}.row.user{align-self:flex-end;flex-direction:row-reverse}.avatar{width:26px;height:26px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}.assistant .avatar{background:var(--ink);color:var(--paper)}.user .avatar{background:var(--accent);color:var(--accent-ink)}.bubble{padding:10px 13px;border-radius:9px;font-size:14.5px}.assistant .bubble{background:var(--panel);border:1px solid var(--line)}.user .bubble{background:var(--accent);color:var(--accent-ink)}.bubble p{margin:0 0 6px}.bubble p:last-child{margin-bottom:0}.card,.ticket{border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden;background:var(--paper)}.card .hd{padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.bays{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}.bay{background:var(--panel);padding:9px 8px;font-size:12.5px}.bay .id{font-weight:600}.bay[data-s=free]{background:var(--free-bg);color:var(--free)}.bay[data-s=taken]{background:var(--taken-bg);color:var(--taken)}.bay[data-s=held]{background:var(--held-bg);color:var(--held)}.ticket{padding:12px}.ticket .id{font-size:22px;font-weight:700;font-family:"IBM Plex Mono",monospace}.ticket dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.ticket dt{color:var(--muted)}.ticket dd{margin:0}.chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 10px}.chip,.themebtn,.uploadbtn{font:inherit;font-size:12.5px;padding:7px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel)}.composer input{flex:1;font:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}.composer button{font:inherit;font-weight:600;font-size:14px;padding:0 18px;border-radius:8px;border:0;background:var(--ink);color:var(--paper)}.side{padding:16px;overflow-y:auto;background:var(--panel)}.side h2{font-size:13px;margin:0 0 3px}.sub,.note{font-size:12px;color:var(--muted)}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.stat b{font-family:"IBM Plex Mono",monospace}.plan{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.pbay{border:1px solid var(--line);border-radius:6px;padding:8px 9px;text-align:left;background:var(--paper);color:var(--ink);cursor:pointer;font:inherit;font-size:12.5px}.pbay .id{font-weight:600;font-family:"IBM Plex Mono",monospace}.pbay .st{display:block;font-size:11.5px;margin-top:2px}.pbay[data-s=free]{border-color:var(--free)}.pbay[data-s=free] .st{color:var(--free)}.pbay[data-s=taken]{border-color:var(--taken)}.pbay[data-s=taken] .st{color:var(--taken)}.pbay[data-s=held]{border-color:var(--held)}.pbay[data-s=held] .st{color:var(--held)}.note{margin-top:14px;line-height:1.5}.themebtn,.uploadbtn{margin-top:8px;width:100%}.uploadbtn{border-color:var(--accent);color:var(--accent)}@media(max-width:840px){.body{grid-template-columns:1fr}.chatcol{border-right:0}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">AP</div><div><h1>AI-PARK</h1><p>Lot A Â· <span id="bayCountLabel">8 bays</span></p></div></div><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Demo data Â· not connected to a live camera</span></div></header>
<div class="body"><div class="chatcol"><div class="thread" id="thread"></div><div class="chips" id="chips"><button class="chip" data-q="How many bays are free?">How many bays are free?</button><button class="chip" data-q="Hold a bay for KA20AB1234">Hold a bay</button><button class="chip" data-q="What's the status of B3?">Status of B3</button><button class="chip" data-q="Reset the lot">Reset the lot</button></div><form class="composer" id="composer"><input id="input" type="text" placeholder="Ask about the lot, or hold a bay for a plate" autocomplete="off"><button type="submit">Send</button></form></div><aside class="side"><h2>Lot A</h2><p class="sub">Reference snapshot for this conversation</p><div class="stat"><span>Free</span><b id="statFree">5</b></div><div class="stat"><span>Occupied</span><b id="statTaken">2</b></div><div class="stat"><span>Held</span><b id="statHeld">1</b></div><div class="plan" id="plan"></div><p class="note">Click a bay to correct it by hand.</p><input type="file" id="imageInput" accept="image/*" style="display:none"><button class="uploadbtn" id="uploadBtn">Upload a lot photo</button><button class="themebtn" id="themeBtn">Switch to dark</button></aside></div>
<script>
const API_BASE="";let IDS=["A1","A2","A3","A4","B1","B2","B3","B4"];let state={A1:"free",A2:"taken",A3:"free",A4:"free",B1:"held",B2:"taken",B3:"free",B4:"free"};const $=s=>document.querySelector(s),thread=$("#thread"),plan=$("#plan");function counts(){const c={free:0,taken:0,held:0};IDS.forEach(id=>c[state[id]]++);return c}function renderSide(){const c=counts();$("#statFree").textContent=c.free;$("#statTaken").textContent=c.taken;$("#statHeld").textContent=c.held;$("#bayCountLabel").textContent=IDS.length+" bays";plan.innerHTML=IDS.map(id=>{const s=state[id],label={free:"Free",taken:"Occupied",held:"Held"}[s];return `<button class="pbay" data-s="${s}" data-id="${id}"><span class="id">${id}</span><span class="st">${label}</span></button>`}).join("")}function bubble(role,html){const row=document.createElement("div");row.className="row "+role;row.innerHTML=`<div class="avatar">${role==="assistant"?"AP":"You"}</div><div class="bubble">${html}</div>`;thread.appendChild(row);thread.scrollTop=thread.scrollHeight}function miniGrid(){const c=counts();return `<div class="card"><div class="hd"><span>Lot A</span><span>${c.free} free Â· ${c.taken} occupied Â· ${c.held} held</span></div><div class="bays">${IDS.map(id=>`<div class="bay" data-s="${state[id]}"><span class="id">${id}</span></div>`).join("")}</div></div>`}function ticketCard(id,plate){const until=new Date(Date.now()+9e5).toTimeString().slice(0,5);return `<div class="ticket"><div class="id">${id}</div><dl><dt>Vehicle</dt><dd>${plate}</dd><dt>Held until</dt><dd>${until}</dd><dt>Entry</dt><dd>Gate 1, turn left</dd></dl></div>`}async function uploadImage(file){bubble("assistant","<p>Analyzing the uploaded photoâ€¦</p>");try{const form=new FormData();form.append("file",file);const res=await fetch(`${API_BASE}/api/detect/auto`,{method:"POST",body:form});if(!res.ok){const err=await res.json().catch(()=>({detail:res.statusText}));bubble("assistant",`<p>Calibration failed: ${err.detail||"unknown error"}. Try a clearer photo of the lot.</p>`);return}const data=await res.json();if(!data.bays||!data.bays.length){bubble("assistant","<p>I couldn't find any parking bays in that photo. Try a different angle or a clearer shot.</p>");return}IDS=data.bays.map(b=>b.id);state={};data.bays.forEach(b=>state[b.id]=b.status==="occupied"?"taken":"free");$("#statusDot").classList.remove("off");$("#statusText").textContent="Live Â· calibrated from uploaded photo";renderSide();bubble("assistant",`<p>Found ${IDS.length} bays in that photo.</p>`+miniGrid())}catch(e){bubble("assistant",`<p>Couldn't reach the backend (${e.message}). Check the server is running.</p>`)}}function reply(text){const lower=text.trim().toLowerCase(),match=lower.match(new RegExp(`\\b(${IDS.join("|")})\\b`));if(/free|available|how many/.test(lower)&&!/hold|reserve/.test(lower)){const c=counts();bubble("assistant",`<p>${c.free} of ${IDS.length} bays are free right now.</p>`+miniGrid());return}if(match&&!/hold|reserve/.test(lower)){const id=match[0].toUpperCase(),s=state[id];bubble("assistant",`<p>Bay ${id} ${{free:"is free.",taken:"is occupied.",held:"is currently held for an incoming vehicle."}[s]}</p>`+miniGrid());return}if(/hold|reserve|assign|park/.test(lower)){const plate=(text.match(/[A-Za-z]{2}\s?-?\d{1,2}\s?-?[A-Za-z]{1,2}\s?-?\d{3,4}/)||[""])[0].toUpperCase().trim(),id=IDS.find(x=>state[x]==="free");if(!id){bubble("assistant","<p>The lot is full â€” no free bays to hold right now.</p>"+miniGrid());return}if(!plate){bubble("assistant","<p>Which vehicle number should I hold a bay for?</p>");return}state[id]="held";renderSide();bubble("assistant",`<p>Holding bay ${id} for ${plate}.</p>`+ticketCard(id,plate));return}if(/reset/.test(lower)){IDS.forEach((id,i)=>state[id]=i%3===0?"taken":"free");renderSide();bubble("assistant","<p>Lot reset to a fresh demo state.</p>"+miniGrid());return}bubble("assistant","<p>I can tell you how many bays are free, look up a specific bay, or hold a bay for a plate number. What would you like?</p>")}$("#composer").addEventListener("submit",e=>{e.preventDefault();const v=$("#input").value.trim();if(!v)return;bubble("user",`<p>${v.replace(/</g,"&lt;")}</p>`);$("#input").value="";setTimeout(()=>reply(v),260)});$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b){bubble("user",`<p>${b.dataset.q}</p>`);setTimeout(()=>reply(b.dataset.q),260)}});plan.addEventListener("click",e=>{const b=e.target.closest(".pbay");if(!b)return;const order=["free","taken","held"],id=b.dataset.id;state[id]=order[(order.indexOf(state[id])+1)%3];renderSide();bubble("assistant",`<p>Marked ${id} as ${state[id]} by hand.</p>`)});$("#themeBtn").addEventListener("click",()=>{const dark=document.documentElement.getAttribute("data-theme")==="dark";document.documentElement.setAttribute("data-theme",dark?"light":"dark");$("#themeBtn").textContent=dark?"Switch to dark":"Switch to light"});$("#uploadBtn").addEventListener("click",()=>$("#imageInput").click());$("#imageInput").addEventListener("change",e=>{if(e.target.files[0])uploadImage(e.target.files[0])});renderSide();bubble("assistant","<p>I'm the AI-PARK assistant for Lot A. Upload a photo of the lot to calibrate it, or ask me about the demo data below.</p>"+miniGrid());
</script>
</body>
</html>
