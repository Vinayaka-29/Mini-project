services:
  ai-park-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-park-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_NAME=AI-Park Smart System
      - APP_VERSION=1.0.0
      - ENV_STATE=production
    volumes:
      - ./configs:/app/configs
    restart: unless-stopped

